<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>นิรมาน คอนโด</title>
<link rel="icon" type="image/png" href="icon.png">
<link rel="apple-touch-icon" href="icon.png">
<meta name="theme-color" content="#5b8def">
<style>
  body { margin:0; min-height:100vh; display:flex; flex-direction:column; align-items:center; justify-content:center;
    font-family:'Mali',system-ui,sans-serif; background:linear-gradient(180deg,#9fd3ff,#d9efff); color:#2b2d42; }
  img { width:120px; height:120px; margin-bottom:16px; }
  a { color:#2b2d42; font-weight:600; }
  iframe { position:fixed; inset:0; width:100%; height:100%; border:0; background:#d9efff; }
</style>
</head>
<body>
  <!-- credentialless = ไม่ส่งบัญชี Google เข้ากรอบ แก้บั๊ก /u/N/ ตอนล็อกอินหลายบัญชี (หน้าโฆษณาไม่ต้องใช้บัญชี) -->
  <iframe id="app" credentialless title="นิรมาน คอนโด" allow="clipboard-write"></iframe>
  <script>
    (function () {
      var EXEC = "https://script.google.com/macros/s/AKfycbxbvh0R5nTwPk9wR_44_HB5neEnRyP30WDcGioaAkky1LKCkPCQ8JifRS05kqyb8E7U/exec";
      // ส่งต่อ ?p=room&id=... ไปให้หน้าโฆษณาด้วย
      document.getElementById('app').src = EXEC + location.search;
    })();
  </script>
  <img src="icon.png" alt="นิรมาน คอนโด">
  <p>กำลังเปิดหน้าห้องว่าง...</p>
  <p><a href="https://script.google.com/macros/s/AKfycbxbvh0R5nTwPk9wR_44_HB5neEnRyP30WDcGioaAkky1LKCkPCQ8JifRS05kqyb8E7U/exec" target="_top">กดที่นี่ถ้าไม่เปิดอัตโนมัติ</a></p>
</body>
</html>
